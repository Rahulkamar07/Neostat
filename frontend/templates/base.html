<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Document Intelligence Platform{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <div>Neo<span class="gradient-text">Stat</span> DocIntel</div>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/docs" target="_blank" class="nav-link">OpenAPI Docs</a>
        <span class="nav-badge">v1.0.0</span>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Document Intelligence Extraction, Validation & API Platform &bull; Built with FastAPI, Gemini & OCR</p>
  </footer>

  <script src="/static/js/main.js"></script>
</body>
</html>
